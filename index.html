<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASE · Protemaxi</title>
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo-96.png">
<link rel="apple-touch-icon" href="logo-192.png">
<style>
:root{
  --bg:#0b1220; --bg2:#0f1a2e; --card:#13203a; --card2:#182845; --line:#22355a;
  --tx:#e8eefb; --tx2:#9fb0cf; --tx3:#6f82a6;
  --ac:#3b82f6; --ac2:#60a5fa;
  --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
  --ouro:#f5c542; --prata:#c9d2df; --bronze:#d08a4e;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac2)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:800;letter-spacing:.06em;font-size:15px;padding:4px 10px 16px}
.brand small{display:block;font-weight:500;letter-spacing:0;color:var(--tx3);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--tx2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--card)}
.nav a.on{background:var(--ac);color:#fff}
.nav a .lock{margin-left:auto;font-size:11px;opacity:.6}
.nav svg{width:18px;height:18px;flex:none}
aside .foot{margin-top:auto;color:var(--tx3);font-size:11px;padding:8px 10px}
main{min-width:0}
header{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(11,18,32,.92);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
header h1{font-size:18px;margin:0;font-weight:700}
.clock{color:var(--tx2);font-variant-numeric:tabular-nums}
.sp{flex:1}
.avs{display:flex;align-items:center}
.av{position:relative;width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--tx);border:2px solid var(--bg);overflow:visible;flex:none}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:#64748b}
.av .dot.on{background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.avs .av+.av{margin-left:-8px}
.av.lg{width:46px;height:46px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.bad{background:transparent;border-color:#7f1d1d;color:#fca5a5}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{padding:22px 24px 60px;max-width:1500px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.kpi .l{color:var(--tx2);font-weight:600;font-size:13px}
.kpi .v{font-size:44px;font-weight:800;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--tx3);font-size:12.5px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--ac))}
.kpi.k1{--c:var(--info)} .kpi.k2{--c:var(--warn)} .kpi.k3{--c:var(--ok)} .kpi.k4{--c:var(--bad)}
.kpi.k4 .v{color:#fca5a5}
.row{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.mini .m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.mini .m b{font-size:22px;font-variant-numeric:tabular-nums}
.mini .m span{color:var(--tx2);font-size:12.5px}
.medal{width:12px;height:12px;border-radius:50%;flex:none}
.medal.ouro{background:var(--ouro)} .medal.prata{background:var(--prata)} .medal.bronze{background:var(--bronze)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--tx3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(34,53,90,.6);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--card2)}
.tbl{overflow:auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card2);color:var(--tx2)}
.pill.aberta{background:rgba(56,189,248,.14);color:#7dd3fc}
.pill.execucao{background:rgba(245,158,11,.15);color:#fcd34d}
.pill.concluida{background:rgba(34,197,94,.15);color:#86efac}
.pill.cancelada{background:rgba(100,116,139,.2);color:#94a3b8}
.pill.ouro{background:rgba(245,197,66,.16);color:var(--ouro)}
.pill.prata{background:rgba(201,210,223,.14);color:var(--prata)}
.pill.bronze{background:rgba(208,138,78,.16);color:var(--bronze)}
.dias{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:5px 8px;border-radius:10px;font-variant-numeric:tabular-nums;line-height:1.05;border:2px solid transparent}
.dias b{font-size:22px;font-weight:900}.dias small{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.9}
.dias.dv{background:rgba(34,197,94,.18);border-color:#22c55e;color:#86efac}
.dias.da{background:rgba(245,158,11,.2);border-color:#f59e0b;color:#fcd34d}
.dias.dr{background:#dc2626;border-color:#ef4444;color:#fff;box-shadow:0 0 0 3px rgba(239,68,68,.25)}
.dias.sm{min-width:0;padding:1px 7px;font-size:12px;font-weight:800;border-width:1px;border-radius:7px;flex-direction:row;box-shadow:none}
.legDias{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);margin:-4px 0 10px}
body.tv .dias b{font-size:30px}
.late{display:inline-grid;place-items:center;min-width:44px;padding:4px 8px;border-radius:8px;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.late.l0{background:rgba(34,197,94,.14);color:#86efac}
.late.l1{background:rgba(245,158,11,.18);color:#fcd34d}
.late.l2{background:rgba(239,68,68,.2);color:#fca5a5}
.late.l3{background:var(--bad);color:#fff}
.muted{color:var(--tx3)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input.in,select.in,textarea.in{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;outline:none;min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--ac)}
textarea.in{width:100%;min-height:120px;resize:vertical}
.onl{display:flex;flex-direction:column;gap:10px}
.onl .u{display:flex;align-items:center;gap:10px}
.onl .u div{min-width:0}
.onl .u b{display:block;font-size:13.5px}
.onl .u small{color:var(--tx3)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--tx2);font-weight:600;border:1px solid transparent;background:none}
.tab.on{background:var(--card2);color:var(--tx);border-color:var(--line)}
.opRow{display:flex;gap:6px;align-items:stretch}.opRow select{flex:1;min-width:0}
.opBox{margin-top:8px}.opEd{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:400}
.opItens{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}.opIt{display:flex;gap:6px}.opIt .in{flex:1;min-width:0}
.escList{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.escCard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--tx);cursor:pointer;font:inherit}
.escCard.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}.escCard .c{float:right;background:var(--bg2);border-radius:6px;padding:0 7px;font-size:12px;font-weight:700}
.escCard .k{color:var(--tx2);font-size:12.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .c{background:var(--bg2);border-radius:6px;padding:0 6px;margin-left:5px;font-size:11.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:5px;cursor:default}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--ac)}
.item .t{font-weight:700;display:flex;align-items:center;gap:8px}
.item .k{color:var(--tx2);font-size:12.5px}
.empty{padding:30px;text-align:center;color:var(--tx3);border:1px dashed var(--line);border-radius:12px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--tx2);cursor:pointer;transition:.15s}
.drop.hover{border-color:var(--ac);background:rgba(59,130,246,.07)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(2,6,15,.7);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--bg2);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column}
.md.wide{width:min(980px,100%)}
.md .hd{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;align-items:center}
.md .bd{padding:18px;overflow:auto}
.md .ft{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--tx2);font-weight:600}
.form label.full{grid-column:1/-1}
.form .in{width:100%}
.chks{display:flex;flex-wrap:wrap;gap:8px}
.chks label{flex-direction:row;align-items:center;gap:6px;background:var(--card);padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--tx)}
.toast{position:fixed;right:18px;bottom:92px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--ac);padding:12px 14px;border-radius:10px;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast div.bad{border-left-color:var(--bad)} .toast div.ok{border-left-color:var(--ok)}
/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{color:var(--tx3);font-size:11.5px;text-align:center;font-weight:700;text-transform:uppercase}
.cal .d{aspect-ratio:1/.8;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:54px}
.cal .d.out{opacity:.25;cursor:default}
.cal .d.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.cal .d.sel{background:rgba(59,130,246,.18)}
.cal .d .n{font-weight:700;font-size:13px}
.cal .d .bar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden}
.cal .d .bar i{display:block;height:100%;background:var(--ok)}
.cal .d.full .n::after{content:" ✓";color:var(--ok)}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card2);border:1px solid var(--line);border-radius:11px;margin-bottom:8px}
.task.done{opacity:.6}
.task.done .tt{text-decoration:line-through}
.task .tt{font-weight:600}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--tx3);display:grid;place-items:center;cursor:pointer;flex:none;background:none;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#06240f;font-weight:900}
.hint{background:rgba(59,130,246,.09);border:1px solid rgba(59,130,246,.3);border-radius:11px;padding:11px 13px;color:var(--tx2);font-size:13px;margin-bottom:14px}
.hint.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3)}
.bm{display:inline-block;background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;text-decoration:none;cursor:grab}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stats .s{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--tx2)}
.stats .s b{color:var(--tx);font-size:16px;margin-right:4px}
.mob{display:none}
body.tv aside,body.tv .notv{display:none!important}
body.tv .app{grid-template-columns:1fr}
body.tv .kpi .v{font-size:60px}
#printArea{display:none}
@media print{
  html,body{background:#fff!important;color:#111!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font:12pt/1.5 system-ui,"Segoe UI",Roboto,sans-serif;color:#111}
  #printArea .ph{background:#0f2147;color:#fff;padding:18px 22px;border-bottom:4px solid #e8a92c;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .pe{font-weight:800;font-size:20pt;letter-spacing:.04em}
  #printArea .pt{color:#e8a92c;font-weight:700;font-size:11pt;letter-spacing:.06em;margin-top:2px}
  #printArea .pb{white-space:pre-wrap;padding:18px 4px}
  #printArea .pf{border-top:1px solid #ccc;padding-top:8px;color:#666;font-size:9pt}
  @page{margin:14mm}
}
@media (max-width:1100px){.row{grid-template-columns:minmax(0,1fr)!important}.kpis{grid-template-columns:repeat(2,1fr)}.mini{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:20;border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  aside .brand,aside .foot{display:none}
  .nav{display:flex;gap:2px}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px}
  .nav a .lock{display:none}
  header{padding:10px 14px}
  header h1{font-size:15px}
  .clock,.hidem{display:none}
  .wrap{padding:14px 12px 90px}
  .kpi .v{font-size:34px}
  .form{grid-template-columns:1fr}
  .hidesm{display:none}
}

/* editor de foto */
.fotoOv{z-index:80}
.fotoStage{position:relative;flex:none;border-radius:14px;overflow:hidden;touch-action:none;background:#000}
.fotoStage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;display:block;cursor:grab}.fotoStage canvas:active{cursor:grabbing}
.fotoMask{position:absolute;inset:0;pointer-events:none;border-radius:50%;box-shadow:0 0 0 999px rgba(2,6,15,.6);outline:2px dashed rgba(255,255,255,.7);outline-offset:-2px}
.avEd{position:relative;cursor:pointer;display:inline-flex}.avEd i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.avEd:hover .av{outline:2px solid var(--ac)}
.dChart{width:100%;height:auto;display:block}.dAx{fill:var(--tx3);font-size:11px}.dBar:hover rect[fill="transparent"]{fill:rgba(255,255,255,.04)}
.lgSw{display:inline-block;width:10px;height:10px;border-radius:3px}
.fx{display:grid;grid-template-columns:56px 110px 1fr;align-items:center;gap:8px;margin-bottom:10px}.fxL{color:var(--tx2);font-size:13px}
.fxB{height:10px;background:var(--bg2);border-radius:6px;overflow:hidden}.fxB i{display:block;height:100%;border-radius:6px}
.fx .dias.sm{justify-content:center;font-size:15px;padding:3px 8px}
.pedBox{border-color:var(--warn);margin-bottom:14px}.ped{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.avBtn{cursor:pointer;display:inline-flex;border-radius:50%}.avBtn:hover .av{outline:2px solid var(--ac)}
.avXL{position:relative;width:110px;height:110px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:36px;font-weight:800;border:3px solid var(--line)}
.avXL img{width:100%;height:100%;border-radius:50%;object-fit:cover}.avXL .dot{position:absolute;right:6px;bottom:6px;width:20px;height:20px;border-radius:50%;border:3px solid var(--bg2);background:#64748b}.avXL .dot.on{background:var(--ok)}
.kgo{cursor:pointer;transition:transform .12s,border-color .12s}.kgo:hover{transform:translateY(-2px);border-color:var(--ac)}
.kpi.kgo::after{content:"ver →";position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--tx3)}.fx.kgo{border-radius:8px;padding:2px 4px;margin-left:-4px;border:1px solid transparent}
.hdrHome{display:inline-flex;margin-right:4px;border-radius:10px;flex:none}.hdrHome img{width:40px;height:40px;border-radius:10px;display:block;box-shadow:0 0 12px rgba(59,130,246,.45);transition:transform .15s}.hdrHome:hover img{transform:scale(1.08)}
.brandLk{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.brandLk img{width:40px;height:40px;border-radius:10px}.brandLk small{display:block}
.dashMarca{display:flex;justify-content:center;margin:28px 0 8px}.dashMarca img{width:min(340px,80%);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
body.tv .dashMarca img{width:min(260px,40%)}
.atrTop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.atrTop div{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:10px 12px}
.atrTop b{display:block;font-size:28px;font-weight:900;color:#fca5a5;line-height:1.1}.atrTop span{font-size:12px;color:var(--tx2)}
/* missões */
.msL{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg2)}.msL[data-med]{cursor:pointer}.msL[data-med]:hover{border-color:var(--ac)}
.msL.venc{border-left:4px solid var(--bad)}
.btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}.btn.ok:hover{background:#15803d}
.msOv{position:fixed;inset:0;z-index:90;background:rgba(2,6,15,.82);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.msBox{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#14254a,#0f1a2e);border:2px solid var(--warn);border-radius:20px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 6px rgba(245,158,11,.15);animation:msIn .25s ease-out}
@keyframes msIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.msX{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:20px;cursor:pointer}.msX:hover{background:var(--bad)}
.msHd{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-right:50px}.msIco{font-size:46px;animation:msPulse 1.4s infinite}@keyframes msPulse{50%{transform:scale(1.12)}}
.msT{font-size:30px;font-weight:900;color:#fcd34d;line-height:1.1}
.msLista{display:flex;flex-direction:column;gap:12px}.msCard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

    const os = {}; for (const o of d.os) { const { id, ...x } = o; os[id] = x; }
    const cl = {}; for (const c of d.clientes || []) { const { id, ...x } = c; cl[id] = x; }
    const ms = {}; for (const m of d.missoes || []) { const { id, ...x } = m; ms[id] = x; }

  async loadAll() {

    const { data, error } = await this.sb.rpc("rpc_sync", { p_login: S.me.login, p_pin: pinDev(), p_desde: null }); if (error) throw error;
    const regs = {}; for (const r of data.regs) (regs[r.tipo] ||= {})[r.id] = r.dados; this.syncAt = data.agora;
    const { data: us, error: e2 } = await this.sb.rpc("rpc_usuarios", { p_login: S.me.login, p_pin: pinDev() }); if (e2) throw e2;
    return { users: us || [], regs };

  async sync() {
    if (!S.me || !this.syncAt || this._sy) return; this._sy = true;
    try {
      const { data, error } = await this.sb.rpc("rpc_sync", { p_login: S.me.login, p_pin: pinDev(), p_desde: this.syncAt }); if (error) throw error;
      this.syncAt = data.agora; S.ultSync = Date.now(); const tipos = new Set();
      for (const r of data.regs) { const old = T(r.tipo)[r.id]; if (JSON.stringify(old) !== JSON.stringify(r.dados)) { T(r.tipo)[r.id] = r.dados; tipos.add(r.tipo); } }
      for (const r of data.dels) if (T(r.tipo)[r.id]) { delete T(r.tipo)[r.id]; tipos.add(r.tipo); }
      if (tipos.has("chat")) chatMudou("chat"); if (tipos.has("nota")) chatMudou("nota");

  async save(tipo, id, dados) { const { error } = await this.sb.rpc("rpc_salvar", { p_login: S.me.login, p_pin: pinDev(), p_tipo: tipo, p_id: id, p_dados: dados }); if (error) throw new Error(error.message.includes("permiss") ? "Você não tem permissão para isso." : error.message); if (tipo !== "sessao") this.ping(); },
  async saveMany(itens) { for (let i = 0; i < itens.length; i += 200) { const { error } = await this.sb.rpc("rpc_salvar_lote", { p_login: S.me.login, p_pin: pinDev(), p_itens: itens.slice(i, i + 200) }); if (error) throw new Error(error.message); } this.ping(); },
  async del(tipo, id) { const { error } = await this.sb.rpc("rpc_excluir", { p_login: S.me.login, p_pin: pinDev(), p_tipo: tipo, p_id: id }); if (error) throw new Error(error.message); this.ping(); },
  async saveUser(u) { const { error } = await this.sb.rpc("rpc_usuario_salvar", { p_login: S.me.login, p_pin: pinDev(), p_user: u }); if (error) throw new Error(error.message); },

  async upload(file) {

  },

/* ---------------- OS: regras de atraso ---------------- */
const STATUS = { aberta: "Aberta", execucao: "Em execução", concluida: "Concluída", cancelada: "Cancelada" };
const ativa = o => o.status === "aberta" || o.status === "execucao";
const prazoEf = o => o.prazo || (abEf(o) ? addDias(abEf(o), +cfg().sla || 3) : "");
function atraso(o) { if (!ativa(o)) return null; const p = prazoEf(o); if (!p) return null; return diasEntre(p, hoje()); }
/* abertura efetiva: o Inside não manda a data de abertura, então estima pela entrega (entrega − prazo padrão)
   ou pelo dia em que a OS apareceu, o que for mais antigo */
function abEf(o) {
  const est = o.origem === "Inside" && (!o.abertura || o.abEst || o.abertura === o.visto);
  if (!est) return o.abertura || "";
  const cands = [o.visto, o.abertura, o.importado ? String(o.importado).slice(0, 10) : "", o.prazo ? addDias(o.prazo, -(+cfg().sla || 3)) : ""].filter(Boolean).sort();
  return cands[0] || "";
}
const diasAberta = o => abEf(o) ? Math.max(0, diasEntre(abEf(o), ativa(o) ? hoje() : (o.conclusao || hoje()))) : null;
const corDias = d => d <= 2 ? "dv" : d <= 4 ? "da" : "dr";
function badgeDias(o) {
  const d = diasAberta(o); if (d == null) return '<span class="muted">—</span>';
  return `<span class="dias ${corDias(d)}" title="${d <= 2 ? "Até 2 dias" : d <= 4 ? "De 3 a 4 dias" : "Mais de 4 dias"} aberta"><b>${d}</b><small>${d === 1 ? "dia" : "dias"}</small></span>`;
}
const legendaDias = () => `<span class="legDias"><span class="dias dv sm">≤2</span> até 2 dias <span class="dias da sm">3–4</span> 3 a 4 dias <span class="dias dr sm">5+</span> mais de 4 dias</span>`;
function badgeAtraso(o) {
  const a = atraso(o);
  if (a === null) return ativa(o) ? '<span class="muted">—</span>' : '<span class="muted">ok</span>';
  if (a < 0) return `<span class="late l0" title="Faltam ${-a} dia(s) para o prazo">${-a}d</span>`;
  if (a === 0) return `<span class="late l1" title="Vence hoje">hoje</span>`;
  return `<span class="late ${a >= 5 ? "l3" : "l2"}" title="${a} dia(s) de atraso">+${a}</span>`;
}
function clienteDe(nome) {
  const n = norm(nome); if (!n) return null; const cl = lista("cliente");
  return cl.find(c => norm(c.nome) === n) || cl.find(c => c.codigo && norm(c.codigo) === n) || cl.find(c => c.grupo && norm(c.grupo) === n)
    || cl.find(c => { const a = norm(c.nome); return a.length > 5 && n.length > 5 && (a.includes(n) || n.includes(a)); }) || null;
}
const tierDe = nome => clienteDe(nome)?.categoria || "";
const pillTier = t => t ? `<span class="pill ${t}">${t[0].toUpperCase() + t.slice(1)}</span>` : "";
function segunda() { const d = new Date(); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); }
function kpis() {
  const os = lista("os"); const seg = segunda();
  const execu = os.filter(o => o.status === "execucao");
  return {
    abertas: os.filter(o => o.status === "aberta").length,
    execucao: execu.length,
    tecnicos: new Set(execu.map(o => norm(o.tecnico)).filter(Boolean)).size,
    semana: os.filter(o => o.status === "concluida" && o.conclusao && o.conclusao >= seg).length,
    atrasadas: os.filter(o => (atraso(o) ?? -1) > 0).length,
  };
}

async function entrar(login, pin) {
  const u = await API.login(login, pin);
  if (!u) throw new Error("Usuário ou PIN incorretos.");

  LS.set("pm_login", { login, pin });

  API.presence.beat(); iniciarSessao(); renderAll();
}

  API.presence.leave(); LS.del("pm_login");

function modal({ titulo, corpo, wide, botoes = [] }) {

  root.innerHTML = `<div class="ov"><div class="md ${wide ? "wide" : ""}"><div class="hd">${titulo}<span class="sp"></span><button class="btn sm" data-x>✕</button></div><div class="bd">${corpo}</div><div class="ft">${botoes.map((b, i) => `<button class="btn ${b.cls || ""}" data-b="${i}">${b.txt}</button>`).join("")}</div></div></div>`;
  const close = () => root.innerHTML = "";
  root.querySelector("[data-x]").onclick = close;
  root.querySelector(".ov").addEventListener("mousedown", e => { if (e.target.classList.contains("ov")) close(); });
  botoes.forEach((b, i) => root.querySelector(`[data-b="${i}"]`).onclick = async e => {
    const el = e.currentTarget; el.disabled = true;
    try { const r = await b.fn?.(root); if (r !== false) close(); } catch (err) { toast(err.message || String(err), "bad"); } finally { el.disabled = false; }
  });
  return root;
}

async function ampliar(file) {
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); });
  const k = img.width < 1600 ? 2 : 1; const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
  const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height); const p = d.data;
  for (let i = 0; i < p.length; i += 4) { const g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; const v = g > 165 ? 255 : g < 90 ? 0 : g; p[i] = p[i + 1] = p[i + 2] = v; }
  x.putImageData(d, 0, 0); return c;
}

function aprenderModelo(t) {
  let s = String(t).replace(/\r/g, "").replace(/\n{3,}/g, "\n\n").trim();
  const cl = lista("cliente");
  const nomes = [...new Set([...cl.map(c => c.nome), ...cl.map(c => c.grupo)].filter(x => x && x.length > 4))].sort((a, b) => b.length - a.length);
  const escRx = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  for (const n of nomes) s = s.replace(new RegExp(escRx(n), "gi"), "{{cliente}}");
  s = s.replace(/^(\s*(?:cliente|condom[ií]nio|unidade|empresa contratante)\s*:\s*)(?!\s*\{\{).+$/gim, "$1{{cliente}}");
  s = s.replace(/^(\s*respons[aá]vel\s*:\s*)(?!\s*\{\{).+$/gim, "$1{{responsavel}}");
  s = s.replace(/^(\s*(?:conta|c[oó]digo)\s*:\s*)(?!\s*\{\{).+$/gim, "$1{{codigo}}");
  s = s.replace(/^(\s*endere[cç]o\s*:\s*)(?!\s*\{\{).+$/gim, "$1{{endereco}}");
  s = s.replace(/^(\s*t[eé]cnicos?\s*:\s*)(?!\s*\{\{).+$/gim, "$1{{tecnicos}}");
  s = s.replace(/^(\s*observa[cç](?:[oõ]es|ão)\s*:\s*)(?!\s*\{\{).+$/gim, "$1{{observacoes}}");
  s = s.replace(/\d{1,2}\/\d{1,2}\/\d{2,4}\s*(?:a|até|-)\s*\d{1,2}\/\d{1,2}\/\d{2,4}/gi, "{{periodo}}");
  s = s.replace(/\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/g, "{{data}}");
  s = s.replace(/\b\d{1,2}[:h]\d{2}\b/g, "{{hora}}");
  s = s.replace(/\b(diurno|noturno)\b/gi, "{{turno}}");
  if (!/\{\{lista_(os|pendentes)\}\}/.test(s)) s += "\n\nSERVIÇOS DO PERÍODO\n{{lista_os}}";
  return s;
}

function carregarScript(src) { return new Promise((ok, no) => { if ([...document.scripts].some(s => s.src === src)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Não foi possível carregar o leitor (abra o app pelo link do GitHub).")); document.head.appendChild(s); }); }
async function extrairTexto(file) {
  const ext = (file.name.split(".").pop() || "").toLowerCase();

  if (ext === "html" || ext === "htm") { const d = new DOMParser().parseFromString(await file.text(), "text/html"); return d.body.innerText || d.body.textContent || ""; }

    const doc = new DOMParser().parseFromString(xml, "application/xml"); const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    return [...doc.getElementsByTagNameNS(W, "p")].map(p => [...p.getElementsByTagNameNS(W, "t")].map(t => t.textContent).join("")).join("\n");
  }
  if (ext === "pdf") {

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; const out = [];
    for (let i = 1; i <= pdf.numPages; i++) { const c = await (await pdf.getPage(i)).getTextContent(); out.push(c.items.map(it => it.str + (it.hasEOL ? "\n" : "")).join("")); }
    return out.join("\n\n");
  }
  if (file.type.startsWith("image/")) {
    await carregarScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");
    return (await Tesseract.recognize(file, "por")).data.text;
  }
  throw new Error("Formato não suportado para modelo. Use Word (.docx), PDF, texto ou imagem.");
}

function editorFoto(src, titulo = "Ajustar foto") {

        <div class="muted" style="font-size:12.5px;text-align:center">Arraste a foto para centralizar o rosto no círculo. Use o zoom ou a rodinha do mouse.</div>
        <label style="width:100%;display:flex;align-items:center;gap:10px">🔍<input type="range" min="1" max="4" step="0.01" value="1" data-fz style="flex:1"></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn sm" data-fr>↻ Girar</button><button class="btn sm" data-fc>🎯 Enquadrar rosto</button><button class="btn sm" data-ft>📁 Trocar imagem</button><input type="file" accept="image/*" hidden data-ff></div>
      </div><div class="ft"><button class="btn" data-fx>Cancelar</button><button class="btn pri" data-fo>Usar foto</button></div></div>`;
    document.body.appendChild(ov);
    const cv = ov.querySelector("canvas"), cx = cv.getContext("2d"), zr = ov.querySelector("[data-fz]");
    const stg = ov.querySelector(".fotoStage"); const lado = Math.round(Math.min(300, innerWidth * .78, innerHeight * .45)); stg.style.width = stg.style.height = lado + "px";

    const base = () => { const w = rot % 180 ? img.height : img.width, h = rot % 180 ? img.width : img.height; return { w, h, k: Math.max(S0 / w, S0 / h) }; };
    const limita = () => { const { w, h, k } = base(); const mx = Math.max(0, (w * k * z - S0) / 2), my = Math.max(0, (h * k * z - S0) / 2); ox = Math.min(mx, Math.max(-mx, ox)); oy = Math.min(my, Math.max(-my, oy)); };

    const desenha = () => { if (!img) return; limita(); pinta(cx, S0 * 2); };

      const { w, h, k } = base(); z = 1; ox = 0; oy = 0;
      if (h > w * .9 || w > h * 1.15) { z = 1.35; const my = (h * k * z - S0) / 2; oy = my * .75; }   // foto de corpo/retrato: aproxima e sobe para o rosto

  let ini = null, mexeu = false;

    if (!ini) return; const dx = e.clientX - ini.x, dy = e.clientY - ini.y;
    if (!mexeu && Math.hypot(dx, dy) < 6) return; mexeu = true; e.preventDefault();

    el.style.left = x + "px"; el.style.top = y + "px"; el.style.right = el.style.bottom = "auto";
  };
  const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up); if (!ini) return; ini = null; if (mexeu) { aoSoltar?.(parseFloat(el.style.left), parseFloat(el.style.top)); setTimeout(() => mexeu = false, 0); } };
  alca.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button:not(.fabBtn),input,textarea,select,label")) return;
    const r = el.getBoundingClientRect(); ini = { x: e.clientX, y: e.clientY, l: r.left, t: r.top }; mexeu = false;
    addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);

  if (sv) { try { const u = await API.login(sv.login, sv.pin); if (u?.maquina) maqPend = [sv.login, sv.pin, u]; else if (u) { S.me = u; S.pin = sv.pin; } else LS.del("pm_login"); } catch {} }
  try { const { users, regs } = await API.loadAll(); S.users = users; S.db = regs; }
  catch (e) { toast("Erro ao conectar: " + e.message, "bad"); }
  API.start();
  if (S.me) iniciarSessao();
  route();
  if (S.me) { setTimeout(checarPedidos, 1500); setTimeout(ofereceMigrar, 2500); setTimeout(() => alertaAtrasos(true), 3500); setInterval(() => alertaAtrasos(false), 10 * 60000); }
  if (maqPend) setTimeout(() => aguardarMaquina(...maqPend), 600);
  else if (!S.me && API === Supa && !sessionStorage.getItem("pm_aviso")) setTimeout(avisoRestrito, 700);
  if (!S.me) { setTimeout(() => alertaAtrasos(true), 4000); setInterval(() => alertaAtrasos(false), 10 * 60000); }
  setTimeout(checarMissoes, 4500); setInterval(checarMissoes, 60000);
  setTimeout(checarPopupClientes, 6000); setInterval(checarPopupClientes, 60000);
  montarChat(); _chatUlt = (chatMsgs().slice(-1)[0] || {}).ts || 0; atualizarFab();
  setTimeout(() => { if (!$("#modalRoot").innerHTML) mostrarNovidades(); }, 900);
  setInterval(checarVersao, 120000); setTimeout(checarVersao, 20000);
  addEventListener("visibilitychange", () => { if (!document.hidden) checarVersao(); });
  setInterval(checarLembretes, 30000); setTimeout(checarLembretes, 3000);
  setInterval(() => { if (S.route === "painel" || S.route === "dashboard") softRender(); }, 60000); // atualiza contadores de atraso
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
